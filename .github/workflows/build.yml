name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'pytest selector to run a subset of tests (empty = full suite)'
        required: false
        default: ''

env:
  PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: 3.9
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10'
            continue-on-error: false
          # Linux CPython pinned to the patch releases current at the 2.4.1 release:
          # later security releases change html.parser to treat <iframe> content as
          # raw text, which breaks this version's iframe tests.
          - platform: ubuntu-22.04
            tox-env: py39
            python-version: '3.9.16'
          - platform: ubuntu-22.04
            tox-env: py310
            python-version: '3.10.11'
          - platform: ubuntu-22.04
            tox-env: py311
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nolxml
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      env:
        PYTEST_ADDOPTS: ${{ inputs.test-filter }}
      run: |
        python -m tox
    - name: Package
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py39'
      run: |
        python -m build -s -w
    - name: Upload distributions
      if: matrix.platform == 'ubuntu-22.04' && matrix.tox-env == 'py39'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
    - name: Upload Results
      if: false
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: ${{ matrix.platform }}-${{ matrix.tox-env }}
        fail_ci_if_error: false

  lint:
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Lint
      run: |
        python -m tox

  documents:
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: documents

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Install Aspell
      run: |
        sudo apt-get install aspell aspell-en
    - name: Build documents
      run: |
        python -m tox
